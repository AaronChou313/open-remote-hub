plugins { id 'com.android.application' }
def releaseVersion = rootProject.file('../../VERSION').text.trim()
def versionNumbers = releaseVersion.tokenize('.').collect { it.toInteger() }
android {
    namespace 'top.openremotehub.client'
    compileSdk 35
    defaultConfig {
        applicationId 'top.openremotehub.client'
        testInstrumentationRunner 'top.openremotehub.client.CompatibilityChecks'
        minSdk 26
        targetSdk 35
        versionCode versionNumbers[0] * 10000 + versionNumbers[1] * 100 + versionNumbers[2]
        versionName releaseVersion
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (System.getenv('ORH_ANDROID_KEYSTORE')) {
            release {
                storeFile file(System.getenv('ORH_ANDROID_KEYSTORE'))
                storePassword System.getenv('ORH_ANDROID_PASSWORD')
                keyAlias 'openremotehub'
                keyPassword System.getenv('ORH_ANDROID_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            if (System.getenv('ORH_ANDROID_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
dependencies { implementation files('libs/orh-client.aar') }
