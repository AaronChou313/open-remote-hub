plugins { id 'com.android.application' }
android {
    namespace 'top.openremotehub.client'
    compileSdk 35
    defaultConfig {
        applicationId 'top.openremotehub.client'
        testInstrumentationRunner 'top.openremotehub.client.CompatibilityChecks'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.4.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { debug { debuggable true } }
}
dependencies { implementation files('libs/orh-client.aar') }
