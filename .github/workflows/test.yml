name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node tests/workflow-ui.mjs
      - run: node tests/workspace-ui.mjs
      - run: node --check static/app.js && node --check static/sessions.js && node --check static/terminal-entry.js && node --check static/workspace.js
