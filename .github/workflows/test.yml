name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node tests/portal-model.mjs && node --check portal/portal.js && node --check portal/cloud.js
      - run: node tests/workflow-ui.mjs
      - run: node tests/workspace-ui.mjs
      - run: node tests/uploads-ui.mjs
      - run: node tests/terminal-browser-ui.mjs
      - run: node tests/proxy-ui.mjs
      - run: node tests/proxy-manager-ui.mjs
      - run: node tests/proxy-nodes-ui.mjs
      - run: node tests/ssh-ui.mjs
      - run: node tests/knowledge-ui.mjs
      - run: node tests/local-services-ui.mjs
      - run: node --check static/applications.js && node --check static/local-services.js
      - run: node --check static/remote-connect.js && node --check static/nodebaby.js && node --check static/lan.js
      - run: node --check static/knowledge.js
      - run: node --check static/ssh.js
      - run: node --check static/app.js && node --check static/sessions.js && node --check static/terminal-entry.js && node --check static/workspace.js && node --check static/dsh.js && node --check static/dsh-compat.js && node --check static/icons.js
  mesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: mesh/go.sum
      - run: go test -race ./internal/...
        working-directory: mesh
      - run: go build ./...
        working-directory: mesh

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: mesh/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - name: Build client APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          sh mesh/packaging/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: orh-client-android
          path: dist/orh-client-android-debug.apk
