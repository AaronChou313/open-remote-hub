name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: mesh/go.sum
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r desktop/requirements.txt
      - name: Build mesh
        working-directory: mesh
        run: go build -trimpath -ldflags "-s -w" -o ..\bin\orh-mesh.exe .\cmd\orh-mesh
      - name: Build application
        shell: pwsh
        run: |
          python mesh/packaging/notices.py
          pyinstaller desktop\orh.spec --noconfirm --distpath build\windows --workpath build\pyinstaller
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "build\windows\OpenRemoteHub\OpenRemoteHub.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--serve" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 1
            try {
              $response = Invoke-WebRequest "http://127.0.0.1:8765/api/auth/status" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) {
            Get-Content "$env:LOCALAPPDATA\OpenRemoteHub\.runtime\server.log" -Tail 80 -ErrorAction SilentlyContinue
            Get-Process | Where-Object { $_.ProcessName -like "*OpenRemoteHub*" } | Stop-Process -Force
            exit 1
          }
          python scripts/smoke_installed.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          Get-Process | Where-Object { $_.ProcessName -eq "orh-mesh" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "smoke ok"
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc windows\orh.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/ORH-Setup-*.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ORH-Setup-*.exe
