name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: mesh/go.sum
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Build mesh
        working-directory: mesh
        run: go build -trimpath -ldflags "-s -w" -o ..\bin\orh-mesh.exe .\cmd\orh-mesh
      - name: Build application
        run: pyinstaller windows\orh.spec --noconfirm --distpath build\windows --workpath build\pyinstaller
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc windows\orh.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/ORH-Setup-*.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ORH-Setup-*.exe
