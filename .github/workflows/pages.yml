name: Publish host portal
on:
  push:
    branches: [main]
    paths: ['portal/**', 'static/icons.svg', 'static/icons-LICENSE.txt', 'scripts/build_portal.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_portal.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .runtime/portal-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
