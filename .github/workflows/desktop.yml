name: Desktop installers
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: mesh/go.sum
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libnss3 libxkbcommon0 libxcb-cursor0 libasound2 libegl1 libgl1 libdbus-1-3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libglib2.0-0 libfontconfig1 xvfb
      - run: python -m pip install -r desktop/requirements.txt
      - run: python scripts/build_desktop.py
      - name: Exercise packaged Agent
        shell: bash
        run: |
          build/desktop/OpenRemoteHub/OpenRemoteHub --serve > build/agent-smoke.log 2>&1 &
          agent_pid=$!
          trap 'kill "$agent_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8765/api/auth/status > /dev/null; then break; fi
            sleep 1
          done
          python scripts/smoke_installed.py || { cat build/agent-smoke.log; exit 1; }
      - name: Exercise Linux native window
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          timeout 20s xvfb-run -a build/desktop/OpenRemoteHub/OpenRemoteHub --client > build/client-smoke.log 2>&1
          result=$?
          set -e
          cat build/client-smoke.log
          build/desktop/OpenRemoteHub/OpenRemoteHub --stop
          test "$result" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.runner }}
          path: |
            dist/OpenRemoteHub-*.dmg
            dist/OpenRemoteHub-*.deb
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OpenRemoteHub-*.dmg
            dist/OpenRemoteHub-*.deb
