name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  mesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: mesh/go.sum
      - run: sh scripts/build_mesh.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mesh
          path: dist/orh-mesh-*
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: mesh/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - name: Build client APK
        env:
          ORH_ANDROID_KEYSTORE: ${{ runner.temp }}/android-release.jks
          ORH_ANDROID_PASSWORD: ${{ secrets.ORH_ANDROID_PASSWORD }}
          ORH_ANDROID_KEYSTORE_BASE64: ${{ secrets.ORH_ANDROID_KEYSTORE_BASE64 }}
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          printf '%s' "$ORH_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ORH_ANDROID_KEYSTORE"
          python3 scripts/build_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: dist/OpenRemoteHub-*-android-arm64.apk
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mesh, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/orh-mesh-*
            dist/OpenRemoteHub-*-android-arm64.apk
          generate_release_notes: true
